; LilyGO T-RGB 2.8" (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM, ST7701S 480x480, GT911)
; Approach A: build on LilyGO's own stack, at the versions they pin
; (github.com/Xinyuan-LilyGO/T-RGB platformio.ini, commit 359c03f).

[platformio]
boards_dir = boards             ; LilyGO's board JSON (qio_opi PSRAM, 16 MB, native USB)

[env:t-rgb]
platform  = espressif32@6.9.0   ; Arduino core 2.0.17 — what the vendor library targets
board     = LilyGo-T-RGB
framework = arduino

board_build.partitions = default_16MB.csv
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
	; ARDUINO_USB_MODE=1 already comes from the board JSON (USB-Serial/JTAG).
	; Route Serial to the USB-C port. Pair with Serial.setTxTimeoutMs(0) (G11)
	; so printing never blocks when no monitor / battery-only.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0

	; lvgl finds lv_conf.h by plain #include (the vendor's copy, in its src/)
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DDISABLE_ALL_LIBRARY_WARNINGS

; Vendor library + exactly the versions its own build pins (T-RGB platformio.ini @ 359c03f).
; Its library.json also pulls (pinned): GFX Library for Arduino 1.5.0, TFT_eSPI 2.5.43.
lib_deps =
	https://github.com/Xinyuan-LilyGO/T-RGB.git#359c03f7cd8e9aaadd4bf0f3fbf790844fd95f98
	lewisxhe/SensorLib @ 0.2.3   ; header #errors on >= 0.3 — this pin is mandatory
	lvgl/lvgl @ 8.4.0            ; not used yet, but the lib's LV_Helper.cpp must compile
